version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    groups:
      npm-patch:
        update-types: ["patch"]
      npm-minor:
        update-types: ["minor"]
        # Zod minors can change public validation/OpenAPI contracts; review separately.
        exclude-patterns: ["zod"]
    ignore:
      # dependency-cruiser (<=18.7) supports typescript <7 only; on TS 7 depcruise
      # silently scans zero modules. Unpin once dependency-cruiser supports TS 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    labels: ["dependencies", "automated"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    groups:
      gh-actions:
        update-types: ["patch", "minor", "major"]
    labels: ["dependencies", "github-actions"]
